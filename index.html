<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>قیمت روز طلا</title>

<style>
body {
    background: #0f172a;
    color: #f8fafc;
    font-family: Tahoma, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: #020617;
    border-radius: 20px;
    padding: 30px 40px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255,215,0,0.2);
}

h1 {
    color: gold;
    margin-bottom: 20px;
}

.price {
    font-size: 32px;
    font-weight: bold;
    margin: 15px 0;
}

.info {
    font-size: 14px;
    color: #94a3b8;
}

.refresh {
    margin-top: 20px;
    font-size: 13px;
}
</style>
</head>
<body>

<div class="card">
    <h1>طلای ۱۸ عیار</h1>
    <div class="price" id="price">در حال دریافت...</div>
    <div class="info" id="bubble"></div>
    <div class="info" id="time"></div>
    <div class="refresh">بروزرسانی خودکار هر 60 ثانیه</div>
</div>

<script>
const TOKEN = "AnRomHyWSrQKZTjYfqce";
const API_URL = "https://alanchand.com/media/api?token=" + TOKEN;

function loadGoldPrice() {
    fetch(API_URL)
        .then(res => res.json())
        .then(data => {
            const gold = data["18ayar"];

            document.getElementById("price").innerText =
                gold.price.toLocaleString() + " تومان";

            document.getElementById("bubble").innerText =
                "حباب: " + gold.bubble.toLocaleString() + " تومان (" + gold.bubble_per + "%)";

            document.getElementById("time").innerText =
                "آخرین بروزرسانی: " + gold.updated_at;
        })
        .catch(err => {
            document.getElementById("price").innerText = "خطا در دریافت قیمت";
            console.error(err);
        });
}

loadGoldPrice();
setInterval(loadGoldPrice, 60000);
</script>

</body>
</html>
